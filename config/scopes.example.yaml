version: 1

scopes:
  example_documents:
    description: "Example document repository"
    enabled: true

    arcsuite:
      # Obtain these values from the operator's licensed ArcSuite environment.
      service_dn: "SET_FROM_OPERATOR_DOCUMENTATION"
      cabinet_alias: "EXAMPLE_CABINET"
      cabinet_id: "rep:YOUR_SERVICE:YOUR_CABINET"
      root_object_id: null
      resolve_references: true

    # Incoming Hard Reference discovery is disabled unless an operator opts in.
    # relationships:
    #   hard_references: false

    # Document integrity reads are disabled unless explicitly enabled per scope.
    # Evidence is a separate opt-in and returns only availability by certificate ID.
    # integrity:
    #   enabled: true
    #   allow_evidence: false

    # Optional read-only content labels. Aliases are caller-visible; the
    # physical ns/name mapping is trusted operator configuration and is never
    # returned through MCP discovery or tool results.
    # content_labels:
    #   preview:
    #     ns: "rep"
    #     name: "user:YOUR_PREVIEW_CONTENT_LABEL"

    # Full-text modes are opt-in per semantic scope. The default, when this
    # block is omitted, is [none]. Enable stemming/thesaurus only after the
    # operator has verified the ArcSuite environment.
    search:
      full_text_modes: [none]

    # Optional v1.1 convenience. HTTPS is the default. The server validates an
    # absolute URL with exactly one {document_id} or {arcsuite_object_id}
    # placeholder in the path/query and no credentials. The host/template remain
    # operator configuration and callers cannot override them.
    # ui:
    #   document_url_template: "https://arcsuite.example.invalid/open?id={document_id}"
    # For a trusted internal HTTP-only UI, set both fields explicitly for this
    # scope. HTTP is not made secure by this option.
    #   allow_http: true
    #   document_url_template: "http://arcsuite-internal.example.invalid/ArcSuite/docspace/sdk/open.do?id={arcsuite_object_id}&enc=UTF-8"

    allowed_object_types:
      - document
      - folder
      - reference

    # Only the system fields needed by the semantic tools are requested.
    default_attr_ids:
      - {ns: "rep", name: "system:name"}
      - {ns: "rep", name: "system:objecttype"}
      - {ns: "rep", name: "system:status"}
      - {ns: "rep", name: "system:modifiedon"}
      - {ns: "rep", name: "system:modifiedby"}
      - {ns: "rep", name: "system:currentrevisionnumber"}
      - {ns: "rep", name: "system:contentlabellist"}

    # Attribute names and IDs are environment-specific. Replace this example
    # mapping only after checking the schema in the licensed environment.
    semantic_attributes:
      document_number:
        attr_id:
          ns: "rep"
          name: "user:YOUR_DOCUMENT_NUMBER_ATTRIBUTE"
        type: string
        operators: [eq, like]
        allow_wildcards: true
        max_length: 128
      name:
        attr_id:
          ns: "rep"
          name: "system:name"
        type: string
        operators: [eq, like]
        allow_wildcards: true
        max_length: 255
      modified_after:
        attr_id:
          ns: "rep"
          name: "system:modifiedon"
        type: datetime
        operators: [gte]
      modified_before:
        attr_id:
          ns: "rep"
          name: "system:modifiedon"
        type: datetime
        operators: [lte]

      # Typed filters are validated against AttributeSchema at startup.
      # integer maps to ArcSuite INT_TYPE or LONG_TYPE; LONG values must fit
      # JavaScript's safe-integer range at request time.
      # page_count:
      #   attr_id: {ns: "rep", name: "user:YOUR_PAGE_COUNT_ATTRIBUTE"}
      #   type: integer
      #   operators: [eq, gte, lte]
      # approved:
      #   attr_id: {ns: "rep", name: "user:YOUR_APPROVED_ATTRIBUTE"}
      #   type: boolean
      #   operators: [eq]
      # quality_score:
      #   attr_id: {ns: "rep", name: "user:YOUR_QUALITY_SCORE_ATTRIBUTE"}
      #   type: number
      #   operators: [eq, gte, lte]
      # published_on:
      #   attr_id: {ns: "rep", name: "user:YOUR_PUBLISHED_ON_ATTRIBUTE"}
      #   type: date
      #   operators: [eq, gte, lte]
      # lifecycle:
      #   attr_id: {ns: "rep", name: "system:status"}
      #   type: enum
      #   operators: [eq]
      #   # I18N_STRING_TYPE enum values use ns/name and are checked against
      #   # AttributeSchema.enumLabels. String-valued enum attributes instead
      #   # use {value: "..."} and are serialized as StringValue.
      #   values:
      #     active: {ns: "rep", name: "ACTIVE"}
      #     retired: {ns: "rep", name: "RETIRED"}
